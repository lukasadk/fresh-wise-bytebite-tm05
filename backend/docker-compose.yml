# Synology Container Manager -> Project -> upload this file.
# (Railway ignores this and uses the Dockerfile + railway.json instead.)
#
# NETWORKING: once this runs ON the NAS, Postgres is local, so the Tailscale
# address in .env should be swapped for the local one. Pick whichever matches
# how your Postgres container is set up:
#
#   a) Postgres published on the NAS host  -> network_mode: host, and use
#      127.0.0.1:5433 in DATABASE_URL (simplest; the ports: block is ignored)
#   b) Postgres on its own compose network -> delete network_mode below,
#      uncomment the networks: blocks, and use the container name as the host
services:
  api:
    build: .
    container_name: freshwise-api
    restart: unless-stopped
    env_file: .env
    network_mode: host
    # ports:                 # only used if you remove network_mode: host
    #   - "8000:8000"
    # networks:
    #   - postgres_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# networks:
#   postgres_default:
#     external: true
