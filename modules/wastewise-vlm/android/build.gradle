plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bytebite.freshwise'
version = '1.0.0'

android {
  namespace 'expo.modules.wastewisevlm'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    minSdk 24
    ndk {
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17'
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }
}

dependencies {
  // Bundles the Latin OCR model in the APK; runtime recognition is offline
  // and does not use a cloud API or key.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
